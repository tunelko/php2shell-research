name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile tooling
        run: python3 -m py_compile solver/*.py research/*.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Profile inventory
        run: ./research/profile_inventory.py --check
      - name: Matrix shape
        run: ./research/matrix_runner.py --set full --dry-run
