; Exact runtime settings used by the public PHP 8.4.26 Bookworm ASLR chain.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

memory_limit = 8M
post_max_size = 64M
upload_max_filesize = 64M

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
; Use a neutral meter name. Public challenge frontends commonly reject the
; default PHP_SESSION_UPLOAD_PROGRESS field before it reaches the origin. Keep
; this replacement exactly 27 bytes to preserve the calibrated heap geometry.
session.upload_progress.name = "progress_meter_challenge_id"


